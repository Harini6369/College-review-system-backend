services:
  api:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/college_reviews
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-teacher@example.com}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-Teacher123}
      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-student@example.com}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-Student123}
      SEED_STUDENT_TWO_EMAIL: ${SEED_STUDENT_TWO_EMAIL:-student2@example.com}
      SEED_STUDENT_TWO_PASSWORD: ${SEED_STUDENT_TWO_PASSWORD:-Student123}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
